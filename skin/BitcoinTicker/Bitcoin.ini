; Bitcoin ticker for Rainmeter
[Rainmeter]
Update=300000
AccurateText=1
Background=#@#Background.png
BackgroundMode=3
BackgroundMargins=0,34,0,14

[Metadata]
Name=Bitcoin Ticker
Author=poiru (base) / contributors
Information=Bitcoin USD and CAD with a local 12-hour history
License=Creative Commons BY-NC-SA 3.0
Version=3.0

[Variables]
fontName=Trebuchet MS
monoFont=Consolas
textSize=8
colorText=255,255,255,205
colorYellow=255,210,60,255
colorUp=80,220,100,255
colorDown=235,60,60,255

[mTimer]
Measure=Calc
Formula=1
OnUpdateAction=[!CommandMeasure mFetch "Run"]

[mFetch]
Measure=Plugin
Plugin=RunCommand
Program=PowerShell.exe
Parameter=-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "#@#ticker.ps1" -ResourcePath "#@#." -RainmeterExe "#PROGRAMPATH#Rainmeter.exe" -Config "#CURRENTCONFIG#"
State=Hide
Timeout=60000
FinishAction=[!UpdateMeter *][!Redraw]

[styleTitle]
StringAlign=Center
StringCase=Upper
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,50
FontColor=#colorText#
FontFace=#fontName#
FontSize=10
AntiAlias=1
ClipString=1

[styleLeftText]
StringAlign=Left
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,20
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1
ClipString=1

[styleCenterText]
StringAlign=Center
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,20
FontColor=#colorText#
FontFace=#fontName#
FontSize=7
AntiAlias=1
ClipString=1

[styleRightMono]
StringAlign=Right
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,50
FontColor=#colorYellow#
FontFace=#monoFont#
FontSize=12
AntiAlias=1
ClipString=1

[styleSeperator]
SolidColor=255,255,255,15

; ---------------- METERS ----------------

[meterTitle]
Meter=String
MeterStyle=styleTitle
X=100
Y=10
W=190
H=18
FontColor=#colorYellow#
Text=* Bitcoin *

[meterSep1]
Meter=Image
MeterStyle=styleSeperator
X=10
Y=30
W=190
H=1

; --- USD ---
[meterUSDLabel]
Meter=String
MeterStyle=styleLeftText
X=10
Y=42
W=50
H=14
Text=USD

[meterUSD]
Meter=String
MeterStyle=styleRightMono
X=200
Y=39
W=140
H=18
Text=$---

; --- CAD ---
[meterCADLabel]
Meter=String
MeterStyle=styleLeftText
X=10
Y=66
W=50
H=14
Text=CAD

[meterCAD]
Meter=String
MeterStyle=styleRightMono
X=200
Y=63
W=140
H=18
Text=$---

[meterSep2]
Meter=Image
MeterStyle=styleSeperator
X=10
Y=88
W=190
H=1

; --- 12-hour graph ---
[meterGraphLabel]
Meter=String
MeterStyle=styleCenterText
X=100
Y=95
W=190
H=11
Text=12 h - one point every 5 min

[meterGraph]
Meter=Image
ImageName=#@#history-0.png
X=28
Y=110
W=144
H=45
DynamicVariables=1

[meterLegend]
Meter=String
MeterStyle=styleCenterText
X=100
Y=160
W=190
H=11
Text=green = up / red = down

[meterUpdated]
Meter=String
MeterStyle=styleCenterText
X=100
Y=172
W=190
H=11
Text=Updated: --:--
