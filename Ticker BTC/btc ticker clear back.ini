; Widget BITCOIN : prix USD + CAD (maj aux 5 min) + mini graphique 12 h. Forme Hexagone. ASCII pur.

[Rainmeter]
Update=1000
DynamicWindowSize=1
AccurateText=1

[Metadata]
Name=Bitcoin Hexagone
Author=poiru (base) / adapte
Information=Prix du Bitcoin en USD et CAD, graphique des variations sur 12 h (aux 5 min) en format hexagonal.
License=Creative Commons BY-NC-SA 3.0
Version=1.1.0

[Variables]
fontName=Trebuchet MS
monoFont=Consolas
textSize=8
colorText=255,255,255,205
colorYellow=255,210,60,255
colorUp=80,220,100,255
colorDown=235,60,60,255
colorBg=25,28,35,230
colorBorder=255,210,60,120

; ---------------- MEASURES ----------------

; --- USD (cette mesure declenche aussi la mise a jour du graphique) ---
[mWebUSD]
Measure=WebParser
URL=https://api.coinbase.com/v2/prices/BTC-USD/spot
RegExp=(?siU)"amount":"([0-9.]+)"
UpdateRate=300
FinishAction=[!UpdateMeasure mUSD][!UpdateMeasure mDelta][!UpdateMeasure mUp][!UpdateMeasure mDown][!UpdateMeasure mPrevUSD][!UpdateMeasure mTime][!UpdateMeter meterGraph][!UpdateMeter meterUpdated][!Redraw]

[mUSD]
Measure=WebParser
URL=[mWebUSD]
StringIndex=1

; --- CAD ---
[mWebCAD]
Measure=WebParser
URL=https://api.coinbase.com/v2/prices/BTC-CAD/spot
RegExp=(?siU)"amount":"([0-9.]+)"
UpdateRate=300

[mCAD]
Measure=WebParser
URL=[mWebCAD]
StringIndex=1

; --- Variation depuis la derniere mise a jour ---
[mPrevUSD]
Measure=Calc
Formula=mUSD
UpdateDivider=-1

[mDelta]
Measure=Calc
Formula=(mPrevUSD=0 || mUSD=0) ? 0 : (mUSD-mPrevUSD)
UpdateDivider=-1
IfCondition=mDelta>0
IfTrueAction=[!SetOption meterUSD FontColor "#colorUp#"][!SetOption meterCAD FontColor "#colorUp#"]
IfCondition2=mDelta<0
IfTrueAction2=[!SetOption meterUSD FontColor "#colorDown#"][!SetOption meterCAD FontColor "#colorDown#"]
IfCondition3=mDelta=0
IfTrueAction3=[!SetOption meterUSD FontColor "#colorYellow#"][!SetOption meterCAD FontColor "#colorYellow#"]

[mUp]
Measure=Calc
Formula=Max(mDelta,0)
UpdateDivider=-1

[mDown]
Measure=Calc
Formula=Max(-mDelta,0)
UpdateDivider=-1

[mTime]
Measure=Time
Format=%H:%M
UpdateDivider=-1

; ---------------- STYLES ----------------

[styleTitle]
StringAlign=Center
StringCase=Upper
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,50
FontColor=#colorText#
FontFace=#fontName#
FontSize=9
AntiAlias=1
ClipString=1

[styleLeftText]
StringAlign=Left
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,20
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1
ClipString=1

[styleCenterText]
StringAlign=Center
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,20
FontColor=#colorText#
FontFace=#fontName#
FontSize=6
AntiAlias=1
ClipString=1

[styleRightMono]
StringAlign=Right
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,50
FontColor=#colorYellow#
FontFace=#monoFont#
FontSize=11
AntiAlias=1
ClipString=1

[styleSeperator]
SolidColor=255,255,255,25

; ---------------- METERS ----------------

; --- Fond Hexagonal (200x200) ---
[meterHexBackground]
Meter=Shape
X=0
Y=0
Shape=Path HexPath | Fill Color #colorBg# | StrokeWidth 2 | Stroke Color #colorBorder#
HexPath=100,2 | 196,52 | 196,148 | 100,198 | 4,148 | 4,52 | ClosePath 1

; --- Titre (dans la pointe haute) ---
[meterTitle]
Meter=String
MeterStyle=styleTitle
X=100
Y=24
W=110
H=16
FontColor=#colorYellow#
Text=* BTC *

[meterSep1]
Meter=Image
MeterStyle=styleSeperator
X=45
Y=43
W=110
H=1

; --- USD (partie large) ---
[meterUSDLabel]
Meter=String
MeterStyle=styleLeftText
X=22
Y=52
W=40
H=14
Text=USD

[meterUSD]
Meter=String
MeterStyle=styleRightMono
MeasureName=mUSD
X=178
Y=49
W=120
H=18
NumOfDecimals=0
Text=$%1

; --- CAD (partie large) ---
[meterCADLabel]
Meter=String
MeterStyle=styleLeftText
X=22
Y=74
W=40
H=14
Text=CAD

[meterCAD]
Meter=String
MeterStyle=styleRightMono
MeasureName=mCAD
X=178
Y=71
W=120
H=18
NumOfDecimals=0
Text=$%1

[meterSep2]
Meter=Image
MeterStyle=styleSeperator
X=20
Y=95
W=160
H=1

; --- Graphique (centre-bas) ---
[meterGraphLabel]
Meter=String
MeterStyle=styleCenterText
X=100
Y=100
W=150
H=10
Text=12 h (5 min)

[meterGraph]
Meter=Histogram
MeasureName=mUp
MeasureName2=mDown
X=35
Y=112
W=130
H=38
PrimaryColor=#colorUp#
SecondaryColor=#colorDown#
SolidColor=255,255,255,15
AutoScale=1
UpdateDivider=-1

; --- Legende et Maj (dans la pointe basse) ---
[meterLegend]
Meter=String
MeterStyle=styleCenterText
X=100
Y=154
W=110
H=10
Text=+ vert / - rouge

[meterUpdated]
Meter=String
MeterStyle=styleCenterText
MeasureName=mTime
X=100
Y=166
W=80
H=10
Text=Maj : %1