
; BITCOIN - USD / CAD - 12H REAL HISTORY
; Rainmeter + Windows PowerShell
; One INI file - ASCII only

[Rainmeter]
Update=300000
AccurateText=1
Background=#@#Background.png
BackgroundMode=3
BackgroundMargins=0,34,0,14

[Metadata]
Name=Bitcoin Simple Memoire
Author=poiru / adapte
Information=BTC USD CAD / 5 min / 12h persistent history
Version=2.0

[Variables]
fontName=Trebuchet MS
monoFont=Consolas
textSize=8
colorText=255,255,255,205
colorYellow=255,210,60,255
colorUp=70,230,130,255
colorDown=255,85,105,255

; POWERSHELL - ALL CODE IS INSIDE THIS INI
; History and graph files are created automatically.

PS1=$ci=[cultureinfo]::InvariantCulture; $dir='#CURRENTPATH#'; $csv=Join-Path $dir 'btc_12h.csv'; $png=Join-Path $dir 'btc_12h.png'; $exe='#PROGRAMPATH#Rainmeter.exe'; $skin='#CURRENTCONFIG#'; $slot=[long]([math]::Floor([DateTimeOffset]::UtcNow.ToUnixTimeSeconds()/300)*300); $hist=@();

PS2=if(Test-Path $csv){ foreach($line in [IO.File]::ReadAllLines($csv)){ $p=$line.Split(','); if($p.Length -eq 3){ try{ $t=[long]$p[0]; $u=[decimal]::Parse($p[1],$ci); $c=[decimal]::Parse($p[2],$ci); if($t -ge ($slot-42900) -and $t -le $slot){ $hist += [pscustomobject]@{t=$t;u=$u;c=$c} } }catch{} } } }; $hist=@($hist | Sort-Object t); $prev=$null; if($hist.Count -gt 0){$prev=$hist[-1]};

PS3=$ok=$false; try{ $a=Invoke-RestMethod -Uri 'https://api.coinbase.com/v2/prices/BTC-USD/spot' -TimeoutSec 15 -ErrorAction Stop; $b=Invoke-RestMethod -Uri 'https://api.coinbase.com/v2/prices/BTC-CAD/spot' -TimeoutSec 15 -ErrorAction Stop; $usd=[decimal]::Parse([string]$a.data.amount,$ci); $cad=[decimal]::Parse([string]$b.data.amount,$ci); $ok=$true }catch{};

PS4=$cu='255,210,60,255'; $cc='255,210,60,255'; $stamp='Maj : hors ligne'; if($ok){ if($prev){ if($usd -gt $prev.u){$cu='70,230,130,255'}elseif($usd -lt $prev.u){$cu='255,85,105,255'}; if($cad -gt $prev.c){$cc='70,230,130,255'}elseif($cad -lt $prev.c){$cc='255,85,105,255'} }; $hist=@($hist | Where-Object {$_.t -ne $slot}); $hist += [pscustomobject]@{t=$slot;u=$usd;c=$cad}; $hist=@($hist | Sort-Object t); $stamp='Maj : '+(Get-Date -Format 'HH:mm'); $lines=@($hist | ForEach-Object {$_.t.ToString()+','+$_.u.ToString('0.00',$ci)+','+$_.c.ToString('0.00',$ci)}); [IO.File]::WriteAllLines($csv,[string[]]$lines,[Text.Encoding]::ASCII) }elseif($prev){$usd=$prev.u; $cad=$prev.c};

PS5=$map=@{}; foreach($r in $hist){$map[[string]$r.t]=$r}; $changes=@{}; $max=0.0; for($i=1;$i -lt 144;$i++){ $t=$slot-(143-$i)*300; $k=[string]$t; $p=[string]($t-300); if($map.ContainsKey($k) -and $map.ContainsKey($p)){ $d=[double]($map[$k].u-$map[$p].u); $changes[$i]=$d; if([Math]::Abs($d) -gt $max){$max=[Math]::Abs($d)} } };

PS6=try{ Add-Type -AssemblyName System.Drawing -ErrorAction Stop; $bmp=[System.Drawing.Bitmap]::new(144,45); $g=[System.Drawing.Graphics]::FromImage($bmp); $g.Clear([System.Drawing.Color]::FromArgb(10,255,255,255)); $green=[System.Drawing.SolidBrush]::new([System.Drawing.Color]::FromArgb(70,230,130)); $red=[System.Drawing.SolidBrush]::new([System.Drawing.Color]::FromArgb(255,85,105)); for($i=1;$i -lt 144;$i++){ if($changes.ContainsKey($i) -and $max -gt 0){ $d=[double]$changes[$i]; if($d -ne 0){ $h=[int][Math]::Max(1,[Math]::Round([Math]::Abs($d)/$max*44)); if($d -gt 0){$brush=$green}else{$brush=$red}; $g.FillRectangle($brush,[int]$i,[int](45-$h),1,$h) } } }; $g.Dispose(); $bmp.Save($png,[System.Drawing.Imaging.ImageFormat]::Png); $bmp.Dispose(); $green.Dispose(); $red.Dispose() }catch{};

PS7=$us='---'; $cs='---'; if($ok -or $prev){$us=$usd.ToString('N0',$ci); $cs=$cad.ToString('N0',$ci)}; & $exe '!SetOption' 'meterUSD' 'Text' ('$'+$us) $skin; & $exe '!SetOption' 'meterCAD' 'Text' ('$'+$cs) $skin; & $exe '!SetOption' 'meterUSD' 'FontColor' $cu $skin; & $exe '!SetOption' 'meterCAD' 'FontColor' $cc $skin; & $exe '!SetOption' 'meterUpdated' 'Text' $stamp $skin;

; ---------------- MEASURES ----------------

[mTimer]
Measure=Calc
Formula=1
OnUpdateAction=[!CommandMeasure mFetch "Run"]

[mFetch]
Measure=Plugin
Plugin=RunCommand
Program=PowerShell.exe
Parameter=-NoProfile -NonInteractive -Command "& { #PS1# #PS2# #PS3# #PS4# #PS5# #PS6# #PS7# }"
State=Hide
OutputType=UTF8
Timeout=60000
FinishAction=[!UpdateMeter *][!Redraw]

; ---------------- STYLES ----------------

[styleTitle]
StringAlign=Center
StringCase=Upper
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,50
FontColor=#colorText#
FontFace=#fontName#
FontSize=10
AntiAlias=1
ClipString=1

[styleLeftText]
StringAlign=Left
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,20
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1
ClipString=1

[styleCenterText]
StringAlign=Center
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,20
FontColor=#colorText#
FontFace=#fontName#
FontSize=7
AntiAlias=1
ClipString=1

[styleRightMono]
StringAlign=Right
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,50
FontColor=#colorYellow#
FontFace=#monoFont#
FontSize=12
AntiAlias=1
ClipString=1

[styleSeperator]
SolidColor=255,255,255,15

