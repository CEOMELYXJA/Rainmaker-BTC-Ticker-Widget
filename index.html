<body>
<main class="widget" aria-label="Bitcoin prices in US and Canadian dollars">
<div class="title">* BITCOIN *</div><div class="line one"></div>
<span class="usd label">USD</span><span class="usd price" id="usd">--</span><span class="cad label">CAD</span><span class="cad price" id="cad">--</span>
<div class="line two"></div><div class="graphlabel">12 h - one point every 5 min</div><canvas id="chart" width="288" height="90" aria-label="Last 12 hours of observed US dollar prices"></canvas><div class="legend">green = up / red = down</div><div class="updated" id="updated">Updated: --:--</div><div class="status" id="status" role="status"></div>
</main>
<script>
'use strict';
const INTERVAL=300000, WINDOW=12*60*60*1000, STORAGE='bitcoin-ticker-v1';
const elements={usd:document.getElementById('usd'),cad:document.getElementById('cad'),updated:document.getElementById('updated'),status:document.getElementById('status'),chart:document.getElementById('chart')};
let samples=[],busy=false,storageOK=true,offline=false;
try { const saved=JSON.parse(localStorage.getItem(STORAGE)||'[]'); if(Array.isArray(saved)) samples=saved.filter(s=>Number.isFinite(s.t)&&Number.isFinite(s.usd)&&s.usd>0&&Number.isFinite(s.cad)&&s.cad>0&&s.t<=Date.now()+60000); } catch (_) { storageOK=false; }
function prune(now){const current=Math.floor(now/INTERVAL)*INTERVAL; samples=samples.filter(s=>s.t>=current-144*INTERVAL && s.t<=current).sort((a,b)=>a.t-b.t);}
function store(){try{localStorage.setItem(STORAGE,JSON.stringify(samples));storageOK=true;}catch(_){storageOK=false;}}
function draw(now){const ctx=elements.chart.getContext('2d'),w=elements.chart.width,h=elements.chart.height;ctx.clearRect(0,0,w,h);const current=Math.floor(now/INTERVAL)*INTERVAL;const points=new Map(samples.map(s=>[s.t,s.usd]));const bars=[];for(let i=143;i>=0;i--){const t=current-i*INTERVAL,price=points.get(t),prev=points.get(t-INTERVAL);if(price!==undefined&&prev!==undefined)bars.push({i:143-i,delta:price-prev});}const max=Math.max(0,...bars.map(b=>Math.abs(b.delta)));if(!max)return;for(const b of bars){if(!b.delta)continue;ctx.fillStyle=b.delta>0?'#50dc64':'#eb3c3c';const height=Math.max(1,Math.abs(b.delta)/max*h);ctx.fillRect(b.i*w/144,h-height,Math.max(1,w/144),height);}}
function render(){const now=Date.now();prune(now);const last=samples.at(-1);for(const currency of ['usd','cad']){const el=elements[currency];el.textContent=last?'$'+last[currency].toLocaleString('en-US',{maximumFractionDigits:0}):'$---';el.classList.remove('up','down');if(last){if(last[currency+'Dir']>0)el.classList.add('up');if(last[currency+'Dir']<0)el.classList.add('down');}}elements.updated.textContent=last?'Updated: '+new Date(last.observedAt||last.t).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false}):'Updated: --:--';draw(now);}
async function getPrice(currency){const r=await fetch('https://api.coinbase.com/v2/prices/BTC-'+currency+'/spot',{cache:'no-store'});if(!r.ok)throw Error('Price request failed');const data=await r.json(),value=Number(data?.data?.amount);if(!Number.isFinite(value)||value<=0)throw Error('Invalid price');return value;}
async function update(){if(busy)return;busy=true;try{const [usd,cad]=await Promise.all([getPrice('USD'),getPrice('CAD')]);const now=Date.now(),t=Math.floor(now/INTERVAL)*INTERVAL,last=samples.at(-1);const entry={t,observedAt:now,usd,cad,usdDir:last?Math.sign(usd-last.usd):0,cadDir:last?Math.sign(cad-last.cad):0};if(last&&last.t===t)samples.pop();samples.push(entry);prune(now);store();offline=false;elements.status.textContent=storageOK?'':'Local saving unavailable';}catch(_){offline=true;elements.status.textContent='Offline - showing last saved data';}finally{busy=false;render();}}

render();update();setInterval(update,INTERVAL);
</script>
